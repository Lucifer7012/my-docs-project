<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to UgPhone Help Center</title>
  <meta http-equiv="refresh" content="0; url=https://my-docs-project.pages.dev/">
  <link rel="canonical" href="https://my-docs-project.pages.dev/">
  <script>
    (function () {
      var repoBase = "/my-docs-project";
      var targetBase = "https://my-docs-project.pages.dev";
      var path = window.location.pathname || "/";
      if (path.toLowerCase().indexOf(repoBase.toLowerCase()) === 0) {
        path = path.slice(repoBase.length) || "/";
      }
      var target = targetBase + path + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #1f2937;
      display: grid;
      min-height: 100vh;
      place-items: center;
    }
    main {
      max-width: 560px;
      padding: 32px;
      border: 1px solid #dbe2ea;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    h1 { margin-top: 0; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <main>
    <h1>Redirecting</h1>
    <p>This GitHub Pages URL has moved to the primary Cloudflare Pages site.</p>
    <p><a href="https://my-docs-project.pages.dev/">Open the latest site</a></p>
  </main>
</body>
</html>
